<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa Station | Content Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #ff4757;
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); }

        /* --- Navbar --- */
        nav {
            background: #1a1a1a;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
        }

        .logo { font-size: 20px; font-weight: 900; color: var(--primary-color); text-decoration: none; }

        /* --- Viewer Controls --- */
        .controls {
            background: #151515;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        select {
            padding: 10px 20px;
            background: var(--card-bg);
            color: white;
            border: 1px solid var(--primary-color);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        .btn {
            padding: 10px 25px;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* --- Content Area --- */
        .content-area {
            max-width: 900px;
            margin: 20px auto;
            text-align: center;
            min-height: 60vh;
        }

        .content-area img {
            width: 100%;
            display: block;
            margin-bottom: 2px; /* For Manhwa style */
        }

        .video-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 2px dashed #333;
        }

        footer { text-align: center; padding: 40px; color: #555; }
    </style>
</head>
<body>

    <nav>
        <a href="milf-exchange-plan.html" class="btn">Read Now</a>

        <span>Content Viewer</span>
    </nav>

    <div class="controls">
        <a href="#" class="btn"><i class="fas fa-arrow-left"></i> Prev</a>
        
        <select id="selector">
            <option value="1">Chapter / Episode 01</option>
            <option value="2">Chapter / Episode 02</option>
            <option value="3">Chapter / Episode 03</option>
        </select>

        <a href="#" class="btn">Next <i class="fas fa-arrow-right"></i></a>
    </div>

    <div class="content-area">
        <div class="video-placeholder">
            <p><i class="fas fa-play-circle fa-3x" style="color: var(--primary-color);"></i><br>Video Player will appear here</p>
        </div>

        <hr style="margin: 40px 0; border-color: #222;">

        <div class="manhwa-images">
            <p style="margin-bottom: 20px; color: #888;">(Example of Manhwa Reading Mode)</p>
            <img src="https://via.placeholder.com/800x1200?text=Manhwa+Page+1" alt="Page 1">
            <img src="https://via.placeholder.com/800x1200?text=Manhwa+Page+2" alt="Page 2">
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Manhwa Station | All Rights Reserved</p>
    </footer>

</body>
</html>
